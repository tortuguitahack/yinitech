<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso a tu Producto - Yinitech</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0f0f23 0%, #1a1a3a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: #fff; }
        .container { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 40px; max-width: 500px; width: 100%; backdrop-filter: blur(10px); }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo svg { width: 60px; height: 60px; }
        h1 { text-align: center; font-size: 1.8rem; margin-bottom: 10px; background: linear-gradient(135deg, #00d4aa, #0099ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { text-align: center; color: rgba(255,255,255,0.7); margin-bottom: 30px; }
        .token-input { width: 100%; padding: 16px; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; background: rgba(0,0,0,0.3); color: #fff; font-size: 1rem; margin-bottom: 16px; font-family: monospace; }
        .token-input:focus { outline: none; border-color: #00d4aa; box-shadow: 0 0 0 3px rgba(0,212,170,0.2); }
        .btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #00d4aa, #0099ff); border: none; border-radius: 12px; color: #fff; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,212,170,0.3); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .status { text-align: center; padding: 16px; border-radius: 12px; margin-top: 20px; display: none; }
        .status.success { display: block; background: rgba(0,212,170,0.2); border: 1px solid #00d4aa; color: #00d4aa; }
        .status.error { display: block; background: rgba(255,68,68,0.2); border: 1px solid #ff4444; color: #ff4444; }
        .product-info { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 20px; margin: 20px 0; display: none; }
        .product-info h3 { color: #00d4aa; margin-bottom: 10px; }
        .product-info p { color: rgba(255,255,255,0.8); margin: 8px 0; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #00d4aa; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .auto-fill { text-align: center; margin-top: 16px; font-size: 0.85rem; color: rgba(255,255,255,0.5); }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="48" stroke="url(#grad)" stroke-width="4"/>
                <path d="M30 50 L45 65 L70 35" stroke="url(#grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                <defs>
                    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#00d4aa"/>
                        <stop offset="100%" style="stop-color:#0099ff"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>
        <h1>Acceso a tu Producto</h1>
        <p class="subtitle">Ingresa tu token de acceso para descargar tu compra</p>
        
        <div id="tokenForm">
            <input type="text" id="tokenInput" class="token-input" placeholder="Pega tu token de acceso aquí (32 caracteres)" maxlength="32" autocomplete="off">
            <button id="accessBtn" class="btn">Verificar y Acceder</button>
        </div>
        
        <div class="auto-fill">
            ¿Token en URL? La página detecta automáticamente <code>?token=xxx&tx=yyy</code>
        </div>
        
        <div id="status" class="status"></div>
        
        <div id="productInfo" class="product-info">
            <h3 id="productTitle"></h3>
            <p><strong>Email:</strong> <span id="userEmail"></span></p>
            <p><strong>Monto pagado:</strong> <span id="amountPaid"></span></p>
            <p><strong>Fecha de entrega:</strong> <span id="deliveryDate"></span></p>
            <p><strong>Enlace de descarga:</strong> <a id="downloadLink" href="#" target="_blank" style="color: #00d4aa;">Descargar contenido</a></p>
        </div>
    </div>

    <script>
        // Configuración
        const VERIFY_ENDPOINT = 'https://ebccde69d5c106e9-181-115-143-101.serveousercontent.com/yinitech/api/verify';
        // const VERIFY_ENDPOINT = 'http://localhost:5681/verify'; // Local
        
        // Elementos DOM
        const tokenInput = document.getElementById('tokenInput');
        const accessBtn = document.getElementById('accessBtn');
        const tokenForm = document.getElementById('tokenForm');
        const statusDiv = document.getElementById('status');
        const productInfo = document.getElementById('productInfo');
        const productTitle = document.getElementById('productTitle');
        const userEmail = document.getElementById('userEmail');
        const amountPaid = document.getElementById('amountPaid');
        const deliveryDate = document.getElementById('deliveryDate');
        const downloadLink = document.getElementById('downloadLink');
        
        // Auto-detectar token en URL
        function autoDetectToken() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const tx = params.get('tx');
            if (token && tx) {
                tokenInput.value = token;
                tokenInput.dataset.tx = tx;
                verifyAccess(token, tx);
            }
        }
        
        // Verificar acceso
        async function verifyAccess(token, tx) {
            if (!token || !tx) return;
            
            accessBtn.disabled = true;
            accessBtn.innerHTML = '<span class="spinner"></span> Verificando...';
            statusDiv.style.display = 'none';
            
            try {
                const response = await fetch(`${VERIFY_ENDPOINT}?token=${encodeURIComponent(token)}&tx=${encodeURIComponent(tx)}`);
                const data = await response.json();
                
                if (data.valid) {
                    showSuccess(data);
                } else {
                    showError(data.error || 'Token inválido o expirado');
                }
            } catch (error) {
                showError('Error de conexión. Intenta de nuevo.');
                console.error(error);
            } finally {
                accessBtn.disabled = false;
                accessBtn.textContent = 'Verificar y Acceder';
            }
        }
        
        function showSuccess(data) {
            statusDiv.className = 'status success';
            statusDiv.innerHTML = '✅ Acceso verificado correctamente';
            statusDiv.style.display = 'block';
            
            tokenForm.style.display = 'none';
            productInfo.style.display = 'block';
            
            productTitle.textContent = data.product_title || 'Producto Premium';
            userEmail.textContent = data.email || '—';
            amountPaid.textContent = '$' + (data.amount ? data.amount.toFixed(2) : '6.99') + ' USD';
            deliveryDate.textContent = data.delivered_at ? new Date(data.delivered_at).toLocaleString() : new Date().toLocaleString();
            downloadLink.href = data.download_url || '#';
            downloadLink.textContent = data.download_url ? 'Descargar ahora →' : 'Enlace no disponible';
        }
        
        function showError(message) {
            statusDiv.className = 'status error';
            statusDiv.innerHTML = '❌ ' + message;
            statusDiv.style.display = 'block';
        }
        
        // Event listeners
        accessBtn.addEventListener('click', () => {
            const token = tokenInput.value.trim();
            const tx = tokenInput.dataset.tx || new URLSearchParams(window.location.search).get('tx');
            if (token.length === 32 && tx) {
                verifyAccess(token, tx);
            } else {
                showError('Token debe tener 32 caracteres y transacción (tx) requerida');
            }
        });
        
        tokenInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') accessBtn.click();
        });
        
        // Auto-focus
        tokenInput.focus();
        
        // Auto-detect on load
        autoDetectToken();
    </script>
</body>
</html>
