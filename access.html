<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIHACKTOR Ω | Acceso Concedido</title>
    <meta name="description" content="Tu pago ha sido verificado. Accediendo a tu producto...">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --bg-elevated: #0b1220;
            --border: #1e293b;
            --border-bright: #334155;
            --text: #f1f5f9;
            --text-muted: #64748b;
            --accent: #06b6d4;
            --accent-glow: rgba(6, 182, 212, 0.4);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.4);
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .ambient-bg {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(6, 182, 212, 0.08), transparent),
                        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(139, 92, 246, 0.06), transparent),
                        var(--bg);
        }
        .ambient-bg::before {
            content: ''; position: absolute; inset: 0;
            background-image: linear-gradient(rgba(6, 182, 212, 0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(6, 182, 212, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove { 0% { transform: translate(0, 0); } 100% { transform: translate(60px, 60px); } }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; animation: pulse 2s ease-in-out infinite; }
        .status-dot--emerald { background: var(--success); box-shadow: 0 0 12px var(--success-glow); }
        .status-dot--amber { background: var(--warning); box-shadow: 0 0 12px rgba(245, 158, 11, 0.4); }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.9); } }
        .btn-primary { background: linear-gradient(135deg, var(--accent), #0891b2); color: var(--bg); font-weight: 700; padding: 1rem 2rem; border-radius: 12px; border: none; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(6, 182, 212, 0.3); position: relative; overflow: hidden; }
        .btn-primary::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, #22d3ee, var(--accent)); opacity: 0; transition: opacity 0.3s ease; }
        .btn-primary:hover::before { opacity: 1; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary span { position: relative; z-index: 1; }
        .card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px; transition: all 0.3s ease; }
        .card:hover { border-color: var(--border-bright); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
        .glow-success { text-shadow: 0 0 20px var(--success-glow), 0 0 40px var(--success-glow); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp 0.6s ease-out forwards; }
        .delay-1 { animation-delay: 0.1s; opacity: 0; }
        .delay-2 { animation-delay: 0.2s; opacity: 0; }
        .delay-3 { animation-delay: 0.3s; opacity: 0; }
        .spinner { width: 24px; height: 24px; border: 3px solid transparent; border-top-color: currentColor; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="ambient-bg" aria-hidden="true"></div>
    <main class="min-h-screen flex items-center justify-center px-4 py-20">
        <div class="max-w-md w-full text-center">
            <div class="card p-8 card-glow animate-fade-up">
                <div class="flex justify-center mb-6">
                    <div class="status-dot status-dot--emerald"></div>
                </div>
                <h1 class="text-3xl font-black mb-4 glow-success">✅ Acceso Concedido</h1>
                <p class="text-slate-300 mb-6">Tu pago ha sido verificado correctamente.</p>
                
                <div id="access-info" class="space-y-4 mb-6 text-left">
                    <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-4">
                        <p class="text-sm text-slate-400 mb-2">ID de Transacción</p>
                        <p id="tx-id" class="font-mono text-cyan-400 break-all text-sm">Cargando...</p>
                    </div>
                    <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-4">
                        <p class="text-sm text-slate-400 mb-2">Estado</p>
                        <p id="status" class="font-bold text-emerald-400">Verificado ✓</p>
                    </div>
                    <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-4">
                        <p class="text-sm text-slate-400 mb-2">Producto</p>
                        <p id="product" class="font-mono text-slate-200 text-sm">Acceso Digital DIHACKTOR Ω</p>
                    </div>
                </div>

                <div class="space-y-3">
                    <button class="btn-primary w-full" onclick="redirectToProduct()">
                        <span>🚀 Acceder a mi Producto</span>
                    </button>
                    <button class="btn-primary w-full bg-slate-800 hover:bg-slate-700" onclick="window.location.href='/'">
                        <span>← Volver al Catálogo</span>
                    </button>
                </div>
                
                <p class="text-xs text-slate-500 mt-6">
                    Soporte: <a href="https://t.me/d3h1ckt4r_bot" target="_blank" class="text-cyan-400 hover:underline">@d3h1ckt4r_bot</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        // Parse URL parameters
        const params = new URLSearchParams(window.location.search);
        const tx = params.get('tx') || params.get('local') || params.get('bank') || params.get('card');
        const product = params.get('product') || 'Acceso Digital DIHACKTOR Ω';
        
        // Display transaction info
        document.getElementById('tx-id').textContent = tx || 'No proporcionado';
        document.getElementById('product').textContent = product;
        
        // Store access in localStorage for persistence
        if (tx) {
            const accessData = {
                txId: tx,
                product: product,
                grantedAt: new Date().toISOString(),
                expiresAt: new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toISOString() // 1 year
            };
            localStorage.setItem('yinitech_access_' + tx, JSON.stringify(accessData));
            localStorage.setItem('yinitech_latest_access', JSON.stringify(accessData));
        }

        function redirectToProduct() {
            // In production, this would redirect to the actual product content
            // For now, show success and go back to catalog
            alert('🎉 ¡Acceso activado! En producción esto redirigiría a tu contenido descargable (Video HD + PDF + Audio + Workflows n8n).\n\nTu acceso queda registrado permanentemente.');
            window.location.href = '/';
        }

        // Check if we have a valid access token
        if (!tx) {
            document.getElementById('status').textContent = '⚠️ Sin ID de transacción';
            document.getElementById('status').className = 'font-bold text-amber-400';
        }
    </script>
</body>
</html>
